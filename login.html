<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIVAN - Iniciar Sesión</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f1f5f9;">

    <div class="card" style="width: 100%; max-width: 420px; padding: 35px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="assets/image/SIVAN-LOGO.png" alt="logo de SIVAN" class="logo-web">
            <h2 style="margin-top: 10px; color: #1e293b;">SIVAN</h2>
            <p class="section-desc">Sistema Nacional de Vacunación</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Correo o Usuario Institucional</label>
                <input type="text" id="username" placeholder="Ej: master@sivan.gob.ve">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <button type="button" id="btn-login" class="btn btn-primary" style="width: 100%;">Iniciar Sesión</button>
        </form>

        <div style="margin-top: 20px; font-size: 0.8rem; color: #64748b; background: #f8fafc; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0;">
            <p style="margin: 0 0 5px 0; font-weight: bold;">Credenciales de prueba:</p>
            <ul style="margin: 0; padding-left: 15px;">
                <li><strong>Master:</strong> master@sivan.gob.ve</li>
                <li><strong>Subregión:</strong> subregion@sivan.gob.ve</li>
                <li><strong>Vacunador:</strong> vacunador@sivan.gob.ve</li>
            </ul>
        </div>

        <!-- Enlace al Portal de Consulta Pública -->
        <div class="login-footer-link">
            <a href="consulta.html">¿Eres ciudadano? Consulta tu carnet aquí &rarr;</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
