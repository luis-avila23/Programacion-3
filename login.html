<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIVAN - Iniciar Sesión</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page">

    <div class="card login-card">
        <div class="login-card-header">
            <img src="assets/image/SIVAN-LOGO.png" alt="logo de SIVAN" class="logo-web">
            <h2>SIVAN</h2>
            <p class="section-desc">Sistema Nacional de Vacunación</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Correo o Usuario Institucional</label>
                <input type="text" id="username" placeholder="Ej: master@sivan.gob.ve">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Contraseña">
            </div>

            <button type="button" id="btn-login" class="btn btn-primary btn-full">Iniciar Sesión</button>
        </form>

        <div class="login-hints">
            <p>Credenciales de prueba:</p>
            <ul>
                <li><strong>Master:</strong> master@sivan.gob.ve</li>
                <li><strong>Subregión:</strong> subregion@sivan.gob.ve</li>
                <li><strong>Vacunador:</strong> vacunador@sivan.gob.ve</li>
            </ul>
        </div>

        <div class="login-footer-link">
            <a href="consulta.html">¿Eres ciudadano? Consulta tu carnet aquí &rarr;</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
