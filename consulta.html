<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIVAN - Consulta Ciudadana de Vacunación</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <img src="assets/image/SIVAN-LOGO.png" alt="logo de SIVAN" class="logo-html">
            <h1>SIVAN <span>| Portal de Consulta Pública del Ciudadano</span></h1>
        </div>
        <div class="navbar-actions">
            <a href="login.html" class="btn-logout">Acceso Institucional</a>
        </div>
    </header>

    <main class="container">

        <section class="card">
            <h2>Portal de Consulta Ciudadana</h2>
            <p class="section-desc">Ingrese su número de cédula para consultar el estatus de vacunación registrado.</p>
            <div class="form-group search-row">
                <label for="search-document">Número de Cédula</label>
                <div class="input-with-btn">
                    <input type="text" id="search-document" placeholder="Ej: 12345678">
                    <button type="button" id="btn-search-public" class="btn btn-primary">Consultar</button>
                </div>
            </div>
        </section>

        <section class="card consult-result-card is-hidden" id="public-result-card">
            <h2>Resultado de la consulta</h2>
            <p class="section-desc">Documento consultado: <strong id="res-cedula"></strong></p>

            <div class="consult-summary">
                <p><strong>Titular:</strong> <span id="res-nombre">—</span></p>
                <p><strong>Centro de salud:</strong> <span id="res-centro">—</span></p>
                <p><strong>Estatus:</strong> <span id="res-estatus" class="badge-warning">—</span></p>
            </div>

            <div class="table-wrapper">
                <table class="vaccine-table">
                    <thead>
                        <tr>
                            <th>Vacuna</th>
                            <th>Dosis</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="public-vaccine-list"></tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
